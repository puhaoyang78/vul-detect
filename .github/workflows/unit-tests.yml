name: unit-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tree-sitter==0.25.2 tree-sitter-c==0.24.1 tree-sitter-cpp==0.23.4 'z3-solver>=4.13,<5'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
